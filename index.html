<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gothic Market</title>

  <!-- Fonte Bastion (fallback incluído) -->
  <link href="https://fonts.cdnfonts.com/css/bastion" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Bastion', 'Times New Roman', serif;
    }

    body {
      background-color: #000;
      color: #b30000;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #b30000;
    }

    header h1 {
      font-size: 48px;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
    }

    nav a {
      color: #b30000;
      text-decoration: none;
      font-size: 22px;
      transition: 0.3s;
    }

    nav a:hover {
      text-shadow: 0 0 10px red;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .auth-box, .product-box {
      border: 2px solid #b30000;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      background: rgba(20, 0, 0, 0.6);
    }

    h2 {
      margin-bottom: 15px;
      font-size: 32px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 18px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #000;
      border: 1px solid #b30000;
      color: #b30000;
    }

    input[type="file"] {
      border: none;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #b30000;
      color: #000;
      border: none;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
    }

    button:hover {
      background-color: red;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .product-card {
      border: 1px solid #b30000;
      padding: 15px;
      text-align: center;
      background-color: #000;
    }

    .product-card img {
      max-width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #b30000;
      margin-bottom: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 2px solid #b30000;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gothic Market</h1>
    <nav>
      <a href="#login">Вход</a>
      <a href="#register">Регистрация</a>
      <a href="#products">Товары</a>
      <a href="#add">Добавить товар</a>
    </nav>
  </header>

  <div class="container">

    <!-- Login -->
    <section id="login" class="auth-box">
      <h2>Вход пользователя</h2>
      <label>Имя пользователя</label>
      <input type="text" placeholder="Логин" />

      <label>Пароль</label>
      <input type="password" placeholder="Пароль" />

      <button>Войти</button>
    </section>

    <!-- Register -->
    <section id="register" class="auth-box">
      <h2>Регистрация</h2>
      <label>Имя пользователя</label>
      <input type="text" />

      <label>Email</label>
      <input type="email" />

      <label>Пароль</label>
      <input type="password" />

      <button>Зарегистрироваться</button>
    </section>

    <!-- Products -->
    <section id="products" class="product-box">
      <h2>Список товаров</h2>
      <div class="products">
        <div class="product-card">
          <img src="https://via.placeholder.com/300x200" alt="Produto" />
          <h3>Продукт I</h3>
          <p>Описание товара</p>
        </div>
      </div>
    </section>

    <!-- Add Product -->
    <section id="add" class="product-box">
      <h2>Добавить новый товар</h2>

      <label>Название товара</label>
      <input type="text" />

      <label>Описание</label>
      <textarea rows="4"></textarea>

      <label>Цена</label>
      <input type="number" />

      <label>Изображение товара</label>
      <input type="file" accept="image/*" />

      <button>Добавить</button>
    </section>

  </div>

  <footer>
    <p>© 2026 Gothic Market</p>
  </footer>

</body>
</html>
